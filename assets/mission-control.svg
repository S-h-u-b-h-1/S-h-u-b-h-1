<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc">
  <title id="title">Shubhaang Kataruka — Mission Control</title>
  <desc id="desc">A visual profile dashboard covering engineering focus, featured projects, skills, progress and hobbies.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#35533f" stroke-width="1" opacity=".45"/></pattern>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#8fdd6c"/><stop offset=".52" stop-color="#73cdb8"/><stop offset="1" stop-color="#ead59e"/></linearGradient>
    <style>
      .k{font:700 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#bed1b8}.h{font:800 25px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#f0f5e9}.n{font:800 19px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f0f5e9}.b{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#b8ccb7}.s{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#9fce8b}.d{fill:#09150f;stroke:#496c50;stroke-width:1.5}.line{stroke:#426249;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1200" height="1030" rx="24" fill="#07110c"/>
  <rect x="16" y="16" width="1168" height="998" rx="18" fill="url(#grid)"/>
  <rect x="16" y="16" width="1168" height="998" rx="18" fill="none" stroke="#496c50" stroke-width="1.5"/>

  <text x="50" y="68" class="k">MISSION CONTROL / LIVE PROFILE</text>
  <circle cx="1104" cy="60" r="8" fill="#8fdd6c"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle><text x="1121" y="66" class="s">ONLINE</text>
  <line x1="50" y1="89" x2="1150" y2="89" class="line"/>

  <rect x="50" y="124" width="522" height="204" rx="12" class="d"/>
  <text x="76" y="158" class="k">01 / OPERATOR FILE</text>
  <text x="76" y="201" class="h">BUILDING USEFUL AI</text>
  <text x="76" y="231" class="h">THAT SURVIVES REALITY.</text>
  <text x="76" y="268" class="b">B.Tech CSE &amp; AI student making agentic systems,</text>
  <text x="76" y="289" class="b">data products and full-stack software with intent.</text>
  <rect x="76" y="302" width="222" height="6" rx="3" fill="url(#glow)"><animate attributeName="width" values="45;222;120;222" dur="5s" repeatCount="indefinite"/></rect>

  <rect x="598" y="124" width="552" height="204" rx="12" class="d"/>
  <text x="624" y="158" class="k">02 / CURRENT SIGNAL</text>
  <text x="624" y="199" class="n">AGENTIC AI</text><circle cx="837" cy="193" r="7" fill="#8fdd6c"/>
  <text x="624" y="226" class="n">FINANCIAL INTELLIGENCE</text><circle cx="1038" cy="220" r="7" fill="#ead59e"/>
  <text x="624" y="253" class="n">HUMAN-CENTRED PRODUCTS</text><circle cx="1080" cy="247" r="7" fill="#73cdb8"/>
  <text x="624" y="292" class="s">GROUNDED ANSWERS · USEFUL INTERFACES · SHIPPED WORK</text>

  <text x="50" y="375" class="k">03 / LAUNCH BOARD</text>
  <rect x="50" y="397" width="535" height="142" rx="12" class="d"/><rect x="50" y="397" width="8" height="142" rx="4" fill="#8fdd6c"/>
  <text x="80" y="435" class="n">MFPULSE</text><text x="80" y="463" class="s">MUTUAL-FUND INTELLIGENCE</text><text x="80" y="492" class="b">AMFI-backed returns, risk metrics and explainable</text><text x="80" y="513" class="b">portfolio health for Indian investors.</text>
  <text x="526" y="435" class="k" text-anchor="end">01</text>
  <rect x="615" y="397" width="535" height="142" rx="12" class="d"/><rect x="615" y="397" width="8" height="142" rx="4" fill="#ead59e"/>
  <text x="645" y="435" class="n">CA INTEL</text><text x="645" y="463" class="s">EVIDENCE-BACKED TAX INTELLIGENCE</text><text x="645" y="492" class="b">An AI operating system for Indian CA firms,</text><text x="645" y="513" class="b">built around compliance and reliable suggestions.</text>
  <text x="1090" y="435" class="k" text-anchor="end">02</text>
  <rect x="50" y="558" width="535" height="142" rx="12" class="d"/><rect x="50" y="558" width="8" height="142" rx="4" fill="#73cdb8"/>
  <text x="80" y="596" class="n">AI PORTFOLIO</text><text x="80" y="624" class="s">CASE STUDIES + GROUNDED ASSISTANT</text><text x="80" y="653" class="b">A public home for product work, visit analytics</text><text x="80" y="674" class="b">and an assistant tied to verified context.</text>
  <text x="526" y="596" class="k" text-anchor="end">03</text>
  <rect x="615" y="558" width="535" height="142" rx="12" class="d"/><rect x="615" y="558" width="8" height="142" rx="4" fill="#8bbbd6"/>
  <text x="645" y="596" class="n">CORPORATE AI ADOPTION</text><text x="645" y="624" class="s">200,000-ROW ANALYSIS + DASHBOARD</text><text x="645" y="653" class="b">A data story on adoption, investment, productivity</text><text x="645" y="674" class="b">and financial impact across corporations.</text>
  <text x="1090" y="596" class="k" text-anchor="end">04</text>

  <text x="50" y="749" class="k">04 / TOOLCHAIN RACK</text>
  <g class="s">
    <rect x="50" y="769" width="140" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="68" y="791">TYPESCRIPT</text>
    <rect x="202" y="769" width="104" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="220" y="791">REACT</text>
    <rect x="318" y="769" width="104" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="336" y="791">NODE</text>
    <rect x="434" y="769" width="112" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="452" y="791">PYTHON</text>
    <rect x="558" y="769" width="144" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="576" y="791">POSTGRESQL</text>
    <rect x="714" y="769" width="125" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="732" y="791">LANGGRAPH</text>
    <rect x="851" y="769" width="104" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="869" y="791">PANDAS</text>
    <rect x="967" y="769" width="97" height="34" rx="8" fill="#12251a" stroke="#496c50"/><text x="985" y="791">VERCEL</text>
  </g>

  <text x="50" y="855" class="k">05 / BUILD TRAIL</text>
  <line x1="94" y1="906" x2="1090" y2="906" stroke="#496c50" stroke-width="3"/>
  <circle cx="160" cy="906" r="12" fill="#8fdd6c"/><circle cx="460" cy="906" r="12" fill="#73cdb8"/><circle cx="760" cy="906" r="12" fill="#ead59e"/><circle cx="1060" cy="906" r="12" fill="#8fdd6c"/>
  <text x="160" y="875" class="n" text-anchor="middle">2024</text><text x="160" y="939" class="b" text-anchor="middle">BUILD IN PUBLIC</text>
  <text x="460" y="875" class="n" text-anchor="middle">2025</text><text x="460" y="939" class="b" text-anchor="middle">PRODUCT SYSTEMS</text>
  <text x="760" y="875" class="n" text-anchor="middle">2026</text><text x="760" y="939" class="b" text-anchor="middle">INTELLIGENT SYSTEMS</text>
  <text x="1060" y="875" class="n" text-anchor="middle">NEXT</text><text x="1060" y="939" class="b" text-anchor="middle">MORE USEFUL AI</text>
  <rect x="50" y="966" width="1100" height="1" fill="#426249"/>
  <text x="50" y="995" class="s">OFFLINE MODE: DANCE · MOUNTAIN TRAILS · CARS · GOOD CONVERSATIONS</text>
</svg>
