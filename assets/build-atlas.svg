<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Shubhaang Kataruka build atlas</title>
  <desc id="desc">A dark technical dashboard showing Shubhaang's projects, domains, and build direction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07100e"/><stop offset="1" stop-color="#193021"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#89c86b"/><stop offset="1" stop-color="#e2d1a6"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#b7d2a7" stroke-opacity=".09"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="500" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="18" fill="url(#grid)"/>
  <rect x="18" y="18" width="1164" height="464" rx="10" fill="none" stroke="#c8dbba" stroke-opacity=".28"/>

  <g font-family="monospace">
    <text x="44" y="58" fill="#dbe8d8" font-size="15" letter-spacing="3">BUILD ATLAS / 2026</text>
    <text x="44" y="101" fill="#f1f6ed" font-size="35" font-weight="700" letter-spacing="2">SHUBHAANG KATARUKA</text>
    <text x="44" y="128" fill="#9dcc89" font-size="15" letter-spacing="1">AI ENGINEER  //  DATA SYSTEMS BUILDER  //  KOLKATA</text>
    <circle cx="1116" cy="54" r="7" fill="#96dc76" filter="url(#soft)"><animate attributeName="opacity" values="1;.22;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="1134" y="59" fill="#bdd2b5" font-size="12">LIVE</text>
  </g>

  <g transform="translate(44 160)" font-family="monospace">
    <text fill="#c7dabc" font-size="13" letter-spacing="2">SYSTEM INDEX</text>
    <g transform="translate(0 22)">
      <rect width="397" height="54" rx="6" fill="#0c1a12" stroke="#8ecb70" stroke-opacity=".45"/>
      <rect width="8" height="54" rx="4" fill="#8ecb70"/>
      <text x="25" y="23" fill="#eaf3e7" font-size="15" font-weight="700">01 / MFPULSE</text><text x="25" y="42" fill="#a8c49e" font-size="11">mutual-fund intelligence</text>
    </g>
    <g transform="translate(0 88)">
      <rect width="397" height="54" rx="6" fill="#0c1a12" stroke="#c9bd8c" stroke-opacity=".45"/>
      <rect width="8" height="54" rx="4" fill="#e2d1a6"/>
      <text x="25" y="23" fill="#eaf3e7" font-size="15" font-weight="700">02 / CA INTEL</text><text x="25" y="42" fill="#cfc7a8" font-size="11">evidence-backed tax intelligence</text>
    </g>
    <g transform="translate(0 154)">
      <rect width="397" height="54" rx="6" fill="#0c1a12" stroke="#81bca7" stroke-opacity=".45"/>
      <rect width="8" height="54" rx="4" fill="#76b5a1"/>
      <text x="25" y="23" fill="#eaf3e7" font-size="15" font-weight="700">03 / AI PORTFOLIO</text><text x="25" y="42" fill="#a5c9ba" font-size="11">case studies + grounded assistant</text>
    </g>
    <g transform="translate(0 220)">
      <rect width="397" height="54" rx="6" fill="#0c1a12" stroke="#8eb8cb" stroke-opacity=".45"/>
      <rect width="8" height="54" rx="4" fill="#8eb8cb"/>
      <text x="25" y="23" fill="#eaf3e7" font-size="15" font-weight="700">04 / CORPORATE AI</text><text x="25" y="42" fill="#b0c9d5" font-size="11">200K-row adoption analysis</text>
    </g>
  </g>

  <g transform="translate(510 160)" font-family="monospace">
    <text fill="#c7dabc" font-size="13" letter-spacing="2">CURRENT VECTOR</text>
    <circle cx="180" cy="153" r="105" fill="none" stroke="#bfd6af" stroke-opacity=".2"/>
    <circle cx="180" cy="153" r="72" fill="none" stroke="#bfd6af" stroke-opacity=".28" stroke-dasharray="4 7"/>
    <circle cx="180" cy="153" r="39" fill="#16271b" stroke="#9edb7d" stroke-opacity=".8"/>
    <path d="M180 153 252 99" stroke="url(#glow)" stroke-width="3" filter="url(#soft)"><animate attributeName="d" dur="4s" repeatCount="indefinite" values="M180 153 252 99;M180 153 252 210;M180 153 108 210;M180 153 108 99;M180 153 252 99"/></path>
    <circle cx="252" cy="99" r="8" fill="#8ecb70"/><circle cx="252" cy="210" r="7" fill="#e2d1a6"/><circle cx="108" cy="210" r="7" fill="#76b5a1"/><circle cx="108" cy="99" r="7" fill="#8eb8cb"/>
    <text x="143" y="158" fill="#ecf3e9" font-size="14">BUILD</text>
    <text x="259" y="96" fill="#a9cfa0" font-size="11">AGENTIC AI</text><text x="259" y="214" fill="#d6cfad" font-size="11">FINTECH</text>
    <text x="12" y="214" fill="#a5c9ba" font-size="11">PRODUCTS</text><text x="15" y="96" fill="#afcbd5" font-size="11">DATA</text>
  </g>

  <g transform="translate(907 160)" font-family="monospace">
    <text fill="#c7dabc" font-size="13" letter-spacing="2">HUMAN LAYER</text>
    <rect y="22" width="245" height="179" rx="8" fill="#0a1510" stroke="#c4dbb7" stroke-opacity=".25"/>
    <text x="20" y="58" fill="#f0f4ed" font-size="18">DANCE</text><text x="20" y="83" fill="#b5cbb0" font-size="12">movement keeps the</text><text x="20" y="99" fill="#b5cbb0" font-size="12">thinking elastic.</text>
    <path d="M20 116h205" stroke="#d2e2c8" stroke-opacity=".18"/>
    <text x="20" y="143" fill="#f0f4ed" font-size="18">MOUNTAINS + CARS</text><text x="20" y="168" fill="#b5cbb0" font-size="12">routes, roads and</text><text x="20" y="184" fill="#b5cbb0" font-size="12">room to look outward.</text>
  </g>

  <g transform="translate(44 452)" font-family="monospace">
    <text fill="#b4cbb0" font-size="12">RELIABLE AI</text><text x="180" fill="#b4cbb0" font-size="12">FINANCIAL INTELLIGENCE</text><text x="460" fill="#b4cbb0" font-size="12">HUMAN-FRIENDLY SYSTEMS</text>
    <rect y="15" width="1112" height="6" rx="3" fill="#193020"/>
    <rect y="15" width="690" height="6" rx="3" fill="url(#glow)"><animate attributeName="width" values="420;920;690" dur="5s" repeatCount="indefinite"/></rect>
  </g>
</svg>
